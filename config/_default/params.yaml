# CONFIGURACIÓN DEL SITIO

# Apariencia
appearance:
  mode: system      # opciones: light | dark | system
  color: blue       # opciones de Hugo Blox: blue, green, red, orange, teal, purple...

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Hernán Ríos'
    description: 'CV de Hernán Ríos — Ingeniero en Electrónica y Administrador de Infraestructura de Datacenter. VMware, TrueNAS, Docker, monitoreo, redes Fortinet, electrónica y robótica.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Header
header:
  navbar:
    enable: true
    block: floating-theme-toggler

# Footer
footer:
  copyright:
    notice: '© {year} Hernán Ríos'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localización
locale:
  date_format: 'Jan 2, 2006'
  time_format: '15:04'

# Funcionalidades
features:
  math:
    enable: false
  privacy_pack:
    enable: false
